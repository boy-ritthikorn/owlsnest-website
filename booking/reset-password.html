<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ตั้งรหัสผ่านใหม่ · OWL'S NEST</title>
<style>:root{--bg:#0a0a0b;--panel:#15151a;--line:rgba(200,164,92,.25);--gold:#c8a45c;--text:#ebe6dd;--muted:#a1988e;--red:#d66a61;--green:#69ad76}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 Arial,sans-serif}.card{max-width:420px;margin:14vh auto;padding:28px;background:var(--panel);border:1px solid var(--line);border-radius:7px}h1{color:var(--gold);font-size:22px;margin:0 0 8px}p{color:var(--muted)}label{display:block;margin-top:15px;color:var(--muted)}input{width:100%;margin-top:6px;padding:12px;background:#0d0d10;color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:5px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:5px;background:var(--gold);color:#111;font-weight:bold}.msg{min-height:22px;color:var(--red)}.ok{color:var(--green)}@media(max-width:470px){.card{margin:9vh 16px}}</style></head>
<body><div class="card"><h1>ตั้งรหัสผ่านใหม่</h1><p>รหัสนี้ใช้กับหลังบ้านเว็บไซต์ รายการจอง และการตั้งค่า LINE</p><form id="form"><label>รหัสผ่านใหม่<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>ยืนยันรหัสผ่านใหม่<input name="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button>บันทึกรหัสใหม่</button><p id="msg" class="msg"></p></form></div>
<script>var token=location.hash.slice(1);history.replaceState(null,'',location.pathname);document.getElementById('form').onsubmit=async function(e){e.preventDefault();var msg=document.getElementById('msg'),btn=e.target.querySelector('button'),p=e.target.elements.password.value,c=e.target.elements.confirm.value;if(!token){msg.textContent='ลิงก์ไม่ถูกต้องหรือไม่มี Token';return}if(p!==c){msg.textContent='รหัสผ่านทั้งสองช่องไม่ตรงกัน';return}btn.disabled=true;msg.textContent='กำลังบันทึก…';try{var r=await fetch('/booking/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token,new_password:p})}),x=await r.json();if(!r.ok)throw new Error(x.error||'เปลี่ยนรหัสไม่สำเร็จ');token='';e.target.reset();msg.className='msg ok';msg.textContent='เปลี่ยนรหัสเรียบร้อยแล้ว ปิดหน้านี้ได้เลย';btn.style.display='none'}catch(err){msg.textContent=err.message;btn.disabled=false}};</script></body></html>
