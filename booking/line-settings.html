<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>ตั้งค่า LINE · OWL'S NEST</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--panel:#15151a;--line:rgba(200,164,92,.25);--gold:#c8a45c;--text:#ebe6dd;--muted:#a1988e;--red:#d66a61;--green:#69ad76}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 'Noto Sans Thai',sans-serif}.wrap{max-width:620px;margin:7vh auto;padding:18px}.card{background:var(--panel);border:1px solid var(--line);padding:26px;border-radius:7px}h1{color:var(--gold);font-size:23px;margin:0 0 7px}p{color:var(--muted)}label{display:block;margin-top:16px;color:var(--muted);font-size:13px}input{width:100%;margin-top:6px;padding:11px;background:#0d0d10;color:var(--text);border:1px solid rgba(255,255,255,.15);border-radius:5px;font:inherit}button,.btn{display:inline-block;margin-top:18px;padding:11px 16px;border:1px solid var(--gold);background:var(--gold);color:#111;border-radius:5px;font:600 14px inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.5}.msg{min-height:22px;color:var(--red)}.ok{color:var(--green)}.webhook{padding:11px;background:#0d0d10;border:1px dashed var(--line);word-break:break-all;color:var(--gold);user-select:all}.hide{display:none!important}.warn{border-left:3px solid var(--gold);padding:8px 12px;background:#111115;font-size:12.5px}.back{color:var(--gold);text-decoration:none}
</style></head><body><div class="wrap">
<div id="login" class="card hide"><h1>เข้าสู่ระบบ</h1><p>ใช้รหัสเดียวกับหลังบ้านเว็บไซต์</p><label>รหัสผ่าน<input id="pw" type="password" autocomplete="current-password"></label><button id="dologin">เข้าสู่ระบบ</button><p id="loginmsg" class="msg"></p></div>
<div id="settings" class="card hide"><a class="back" href="/booking/admin">← กลับรายการจอง</a><h1 style="margin-top:18px">ตั้งค่า LINE แจ้งเตือน</h1><p class="warn">ข้อมูลด้านล่างจะส่งตรงเข้าเซิร์ฟเวอร์ผ่าน HTTPS และจะไม่แสดงกลับมาอีก ห้ามนำ Token หรือ Secret ไปใส่ในช่องหมายเหตุหรือแชต</p>
<form id="form"><label>Channel secret ที่ออกใหม่<input name="channel_secret" type="password" autocomplete="off" required></label><label>Channel access token (long-lived)<input name="channel_access_token" type="password" autocomplete="off" required></label><button type="submit">ตรวจสอบและบันทึก</button><p id="msg" class="msg"></p></form>
<div id="next" class="hide"><h1 style="margin-top:24px;font-size:19px">Webhook URL</h1><p>คัดลอกลิงก์นี้ไปใส่ใน LINE Developers ขั้นต่อไป:</p><div id="webhook" class="webhook"></div></div>
</div></div>
<script>
async function api(url,opt){var r=await fetch(url,opt),x=await r.json();if(!r.ok)throw new Error(x.error||'เกิดข้อผิดพลาด');return x}
function showLogin(){document.getElementById('login').classList.remove('hide');document.getElementById('settings').classList.add('hide')}
function showSettings(){document.getElementById('login').classList.add('hide');document.getElementById('settings').classList.remove('hide');load()}
async function load(){try{var x=await api('/booking/api/admin/line-settings');if(x.token_configured&&x.secret_configured){document.getElementById('msg').className='msg ok';document.getElementById('msg').textContent='ตั้งค่าแล้ว'+(x.bot_name?' · '+x.bot_name:'');document.getElementById('next').classList.remove('hide');document.getElementById('webhook').textContent=x.webhook_url}}catch(e){if(e.message.indexOf('เข้าสู่ระบบ')>-1)showLogin()}}
document.getElementById('dologin').onclick=async function(){try{await api('/booking/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});showSettings()}catch(e){document.getElementById('loginmsg').textContent=e.message}};
document.getElementById('form').onsubmit=async function(e){e.preventDefault();var btn=e.target.querySelector('button'),msg=document.getElementById('msg'),data=Object.fromEntries(new FormData(e.target).entries());btn.disabled=true;msg.className='msg';msg.textContent='กำลังตรวจสอบกับ LINE…';try{var x=await api('/booking/api/admin/line-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});e.target.reset();msg.className='msg ok';msg.textContent='บันทึกสำเร็จ'+(x.bot_name?' · '+x.bot_name:'');load()}catch(err){msg.textContent=err.message;btn.disabled=false}};
fetch('/booking/api/me').then(function(r){return r.json()}).then(function(x){x.authed?showSettings():showLogin()});
</script></body></html>
