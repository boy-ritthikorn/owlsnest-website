<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>รายการจอง · OWL'S NEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#0a0a0b;--panel:#15151a;--line:rgba(200,164,92,.24);--gold:#c8a45c;--text:#eae5dc;--muted:#9d958b;--green:#69ad76;--red:#d66b63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 'Noto Sans Thai',sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 14px}header{position:sticky;top:0;background:rgba(10,10,11,.96);border-bottom:1px solid var(--line);z-index:3}.head{height:60px;display:flex;align-items:center;gap:12px}.brand{color:var(--gold);font-size:17px}.sp{flex:1}button,.btn{font:inherit;color:var(--text);background:#202027;border:1px solid var(--line);padding:9px 12px;border-radius:5px;cursor:pointer;text-decoration:none}main{padding:20px 0 60px}.tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}input,select{font:inherit;background:#0e0e11;color:var(--text);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:9px;width:100%}.tools input,.tools select{width:auto}.count{color:var(--muted)}.booking{background:var(--panel);border:1px solid var(--line);padding:16px;margin:10px 0;border-radius:7px}.top{display:flex;gap:12px;align-items:flex-start}.time{font-size:24px;color:var(--gold);width:70px}.who{flex:1}.who b{font-size:17px}.phone{color:var(--gold);text-decoration:none}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#28252a;color:#d9d3c9;font-size:11px}.status-confirmed{color:var(--green)}.status-cancelled,.status-no_show{color:var(--red)}.meta{color:var(--muted);margin-top:6px}.edit{display:grid;grid-template-columns:170px 1fr 1.5fr auto;gap:8px;margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.08)}.save{background:var(--gold);color:#111;font-weight:600}.empty{text-align:center;color:var(--muted);padding:55px}.login{max-width:340px;margin:18vh auto;text-align:center;padding:20px}.login h1{color:var(--gold);font-size:20px}.login input{margin:15px 0}.login button{width:100%;background:var(--gold);color:#111;font-weight:600}.err{color:var(--red);min-height:22px}.hide{display:none!important}@media(max-width:700px){.edit{grid-template-columns:1fr}.top{flex-wrap:wrap}.time{width:62px}.who{min-width:200px}}
</style></head><body>
<div id="login" class="login hide"><h1>รายการจอง OWL'S NEST</h1><p>ใช้รหัสเดียวกับหลังบ้านเว็บไซต์</p><input id="pw" type="password" placeholder="รหัสผ่าน"><button id="dologin">เข้าสู่ระบบ</button><p class="err" id="loginerr"></p></div>
<div id="app" class="hide"><header><div class="wrap head"><div class="brand">OWL'S NEST · รายการจอง</div><div class="sp"></div><a class="btn" href="/booking/line-settings">ตั้งค่า LINE</a><a class="btn" href="/booking/" target="_blank">หน้าจอง</a><button id="logout">ออก</button></div></header><main class="wrap"><div class="tools"><input id="date" type="date"><select id="filter"><option value="">ทุกสถานะ</option><option value="pending">รอโทรยืนยัน</option><option value="confirmed">ยืนยันแล้ว</option><option value="no_answer">ติดต่อไม่ได้</option><option value="cancelled">ยกเลิก</option><option value="seated">มาถึงแล้ว</option><option value="completed">เรียบร้อย</option><option value="no_show">ไม่มา</option></select><button id="reload">โหลดใหม่</button><span class="count" id="count"></span></div><div id="list"></div></main></div>
<script>
var labels={pending:'รอโทรยืนยัน',confirmed:'ยืนยันแล้ว',no_answer:'ติดต่อไม่ได้',cancelled:'ยกเลิก',seated:'มาถึงแล้ว',completed:'เรียบร้อย',no_show:'ไม่มา'};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function localDate(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
document.getElementById('date').value=localDate();
async function api(url,opt){var r=await fetch(url,opt),x=await r.json();if(r.status===401){showLogin();throw new Error('กรุณาเข้าสู่ระบบ')}if(!r.ok)throw new Error(x.error||'เกิดข้อผิดพลาด');return x}
function showLogin(){document.getElementById('login').classList.remove('hide');document.getElementById('app').classList.add('hide')}
function showApp(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');load()}
async function load(){var d=document.getElementById('date').value,s=document.getElementById('filter').value;try{var x=await api('/booking/api/admin/bookings?date='+encodeURIComponent(d)+'&status='+encodeURIComponent(s));render(x.bookings)}catch(e){}}
function render(rows){document.getElementById('count').textContent=rows.length+' รายการ';var box=document.getElementById('list');if(!rows.length){box.innerHTML='<div class="empty">ยังไม่มีรายการจองในวันนี้</div>';return}box.innerHTML=rows.map(function(b){return '<article class="booking"><div class="top"><div class="time">'+esc(b.booking_time)+'</div><div class="who"><b>'+esc(b.customer_name)+'</b> · '+b.party_size+' ท่าน<br><a class="phone" href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a><div class="meta">'+esc(b.preference||'ให้ร้านจัดโต๊ะให้')+(b.note?' · '+esc(b.note):'')+'<br>เลขจอง '+esc(b.code)+' · ติดต่อทาง '+esc(b.contact_channel)+'</div></div><span class="tag status-'+esc(b.status)+'">'+esc(labels[b.status]||b.status)+'</span></div><div class="edit"><select data-k="status">'+Object.keys(labels).map(function(k){return '<option value="'+k+'"'+(k===b.status?' selected':'')+'>'+labels[k]+'</option>'}).join('')+'</select><input data-k="tables" value="'+esc(b.assigned_tables)+'" placeholder="โต๊ะที่จัดให้ เช่น A1+A2"><input data-k="note" value="'+esc(b.staff_note)+'" placeholder="บันทึกของทีม"><button class="save" data-id="'+b.id+'">บันทึก</button></div></article>'}).join('')}
document.getElementById('list').addEventListener('click',async function(e){if(!e.target.matches('.save'))return;var row=e.target.closest('.booking'),id=e.target.dataset.id;e.target.disabled=true;try{await api('/booking/api/admin/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,status:row.querySelector('[data-k=status]').value,assigned_tables:row.querySelector('[data-k=tables]').value,staff_note:row.querySelector('[data-k=note]').value})});await load()}catch(err){alert(err.message);e.target.disabled=false}});
document.getElementById('dologin').onclick=async function(){try{await api('/booking/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});showApp()}catch(e){document.getElementById('loginerr').textContent=e.message}};
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('dologin').click()});document.getElementById('reload').onclick=load;document.getElementById('date').onchange=load;document.getElementById('filter').onchange=load;document.getElementById('logout').onclick=async function(){await api('/booking/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});showLogin()};fetch('/booking/api/me').then(function(r){return r.json()}).then(function(x){x.authed?showApp():showLogin()});
</script></body></html>
