<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>รายการจอง · OWL'S NEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#0a0a0b;--panel:#15151a;--line:rgba(200,164,92,.24);--gold:#c8a45c;--text:#eae5dc;--muted:#9d958b;--green:#69ad76;--red:#d66b63;--amber:#d5a448}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 'Noto Sans Thai',sans-serif}.wrap{max-width:1050px;margin:auto;padding:0 14px}header{position:sticky;top:0;background:rgba(10,10,11,.96);border-bottom:1px solid var(--line);z-index:3}.head{min-height:60px;display:flex;align-items:center;gap:12px}.brand{color:var(--gold);font-size:17px}.sp{flex:1}button,.btn{font:inherit;color:var(--text);background:#202027;border:1px solid var(--line);padding:9px 12px;border-radius:5px;cursor:pointer;text-decoration:none}button:hover,.btn:hover{border-color:var(--gold)}main{padding:20px 0 60px}.tools,.month-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}input,select{font:inherit;background:#0e0e11;color:var(--text);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:9px;width:100%}.tools input,.tools select{width:auto}.count{color:var(--muted)}.notice{background:#2b2312;border:1px solid #8a6a25;color:#ead59e;padding:10px 12px;border-radius:6px;margin-bottom:14px}.booking{background:var(--panel);border:1px solid var(--line);padding:16px;margin:10px 0;border-radius:7px}.booking.review{border-color:#8a6a25}.top{display:flex;gap:12px;align-items:flex-start}.time{font-size:24px;color:var(--gold);width:70px}.who{flex:1}.who b{font-size:17px}.phone{color:var(--gold);text-decoration:none}.tag{display:inline-block;padding:3px 8px;border-radius:99px;background:#28252a;color:#d9d3c9;font-size:11px}.review-tag{background:#4a3817;color:#f0d58b}.status-confirmed{color:var(--green)}.status-cancelled,.status-no_show{color:var(--red)}.meta{color:var(--muted);margin-top:6px}.edit{display:grid;grid-template-columns:150px 90px 1fr 1.5fr auto;gap:8px;margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.08)}.save{background:var(--gold);color:#111;font-weight:600}.empty{text-align:center;color:var(--muted);padding:55px}.login{max-width:340px;margin:18vh auto;text-align:center;padding:20px}.login h1{color:var(--gold);font-size:20px}.login input{margin:15px 0}.login button{width:100%;background:var(--gold);color:#111;font-weight:600}.err{color:var(--red);min-height:22px}.hide{display:none!important}.view-tabs{display:flex;gap:8px;margin-bottom:18px}.view-tabs button.active{background:var(--gold);border-color:var(--gold);color:#111;font-weight:600}.month-title{font-size:23px;color:var(--gold);margin:0 auto 0 0}.month-summary{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:0 0 16px}.summary-card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px}.summary-card b{display:block;color:var(--gold);font-size:22px;line-height:1.2}.summary-card span{color:var(--muted);font-size:12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}.weekday{text-align:center;padding:8px 3px;color:var(--muted);background:#101013;border-bottom:1px solid var(--line);font-size:12px}.cal-empty,.cal-day{min-height:112px;border:0;border-right:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07);border-radius:0;background:#121216;color:var(--text);padding:9px;text-align:left}.cal-day{cursor:pointer}.cal-day:hover{background:#1c1b1b}.cal-day.has-bookings{box-shadow:inset 3px 0 var(--amber)}.cal-day.all-confirmed{box-shadow:inset 3px 0 var(--green)}.cal-day.today{background:#211d15}.cal-date{display:block;font-size:16px;color:var(--muted)}.cal-day.today .cal-date{color:var(--gold);font-weight:600}.cal-bookings{display:block;margin-top:8px;color:var(--gold);font-size:16px;font-weight:600}.all-confirmed .cal-bookings{color:var(--green)}.cal-people,.cal-status{display:block;color:var(--muted);font-size:11px;margin-top:2px}.legend{color:var(--muted);font-size:12px;margin-top:10px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 4px 0 12px}.legend i:first-child{margin-left:0}.legend .pending-dot{background:var(--amber)}.legend .confirmed-dot{background:var(--green)}.day-heading{font-size:19px;color:var(--gold);margin:0}.back-calendar{margin-right:3px}
@media(max-width:700px){.head{padding:8px 0;flex-wrap:wrap}.head .brand{width:100%}.edit{grid-template-columns:1fr}.top{flex-wrap:wrap}.time{width:62px}.who{min-width:200px}.month-summary{grid-template-columns:repeat(2,1fr)}.month-title{width:100%;order:-1;font-size:20px}.month-tools{justify-content:center}.calendar{font-size:12px}.weekday{font-size:10px;padding:7px 1px}.cal-empty,.cal-day{min-height:78px;padding:5px 3px}.cal-date{font-size:13px}.cal-bookings{font-size:11px;margin-top:6px}.cal-people,.cal-status{display:none}.view-tabs button{flex:1}.tools input,.tools select{flex:1;min-width:125px}.back-calendar{width:100%}}
</style></head><body>
<div id="login" class="login hide"><h1>รายการจอง OWL'S NEST</h1><p>ใช้รหัสเดียวกับหลังบ้านเว็บไซต์</p><input id="pw" type="password" placeholder="รหัสผ่าน"><button id="dologin">เข้าสู่ระบบ</button><p class="err" id="loginerr"></p></div>
<div id="app" class="hide"><header><div class="wrap head"><div class="brand">OWL'S NEST · รายการจอง</div><div class="sp"></div><a class="btn" href="/booking/line-settings">ตั้งค่า LINE</a><a class="btn" href="/booking/" target="_blank">หน้าจอง</a><button id="logout">ออก</button></div></header><main class="wrap"><div class="view-tabs"><button id="tabCalendar" class="active">ปฏิทินรายเดือน</button><button id="tabDay">รายการรายวัน</button></div><section id="calendarView"><div class="month-tools"><button id="prevMonth">‹ เดือนก่อน</button><h1 class="month-title" id="monthTitle"></h1><button id="thisMonth">เดือนนี้</button><button id="nextMonth">เดือนถัดไป ›</button></div><div class="month-summary" id="monthSummary"></div><div class="calendar" id="calendar"></div><div class="legend"><i class="pending-dot"></i>มีรายการรอยืนยัน <i class="confirmed-dot"></i>ยืนยันครบแล้ว · กดวันที่เพื่อดูรายละเอียด</div></section><section id="dayView" class="hide"><div class="tools"><button id="backCalendar" class="back-calendar">← กลับปฏิทิน</button><h2 class="day-heading" id="dayHeading"></h2><input id="date" type="date"><select id="view"><option value="inbox">รายการปกติ</option><option value="review">กักไว้ตรวจ</option><option value="all">รวมทั้งหมด</option></select><select id="filter"><option value="">ทุกสถานะ</option><option value="pending">รอโทรยืนยัน</option><option value="confirmed">ยืนยันแล้ว</option><option value="no_answer">ติดต่อไม่ได้</option><option value="cancelled">ยกเลิก</option><option value="seated">มาถึงแล้ว</option><option value="completed">เรียบร้อย</option><option value="no_show">ไม่มา</option></select><button id="reload">โหลดใหม่</button><span class="count" id="count"></span></div><div id="notice" class="notice hide">รายการในส่วนนี้น่าจะมาจากบอท จึงไม่ส่งแจ้งเตือน LINE และไม่นับเป็น Lead กรุณาตรวจสอบก่อนติดต่อ</div><div id="list"></div></section></main></div>
<script>
var labels={pending:'รอโทรยืนยัน',confirmed:'ยืนยันแล้ว',no_answer:'ติดต่อไม่ได้',cancelled:'ยกเลิก',seated:'มาถึงแล้ว',completed:'เรียบร้อย',no_show:'ไม่มา'};
var reasonLabels={honeypot:'กรอกช่องล่องหน',too_fast:'กรอกเร็วผิดปกติ',phone_format:'รูปแบบเบอร์ผิดปกติ',link:'มีลิงก์',no_thai:'ไม่มีภาษาไทย'};
var currentMonth=localDate().slice(0,7);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function localDate(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
document.getElementById('date').value=localDate();
async function api(url,opt){var r=await fetch(url,opt),x=await r.json();if(r.status===401){showLogin();throw new Error('กรุณาเข้าสู่ระบบ')}if(!r.ok)throw new Error(x.error||'เกิดข้อผิดพลาด');return x}
function showLogin(){document.getElementById('login').classList.remove('hide');document.getElementById('app').classList.add('hide')}
function showApp(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');showCalendar()}
function monthLabel(value){var p=value.split('-'),d=new Date(Number(p[0]),Number(p[1])-1,1);return new Intl.DateTimeFormat('th-TH',{month:'long',year:'numeric'}).format(d)}
function dayLabel(value){var p=value.split('-'),d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));return new Intl.DateTimeFormat('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}
function setActiveTab(mode){document.getElementById('tabCalendar').classList.toggle('active',mode==='calendar');document.getElementById('tabDay').classList.toggle('active',mode==='day');document.getElementById('calendarView').classList.toggle('hide',mode!=='calendar');document.getElementById('dayView').classList.toggle('hide',mode!=='day')}
async function showCalendar(){setActiveTab('calendar');document.getElementById('monthTitle').textContent=monthLabel(currentMonth);try{var x=await api('/booking/api/admin/calendar?month='+encodeURIComponent(currentMonth));renderCalendar(x)}catch(e){document.getElementById('calendar').innerHTML='<div class="empty">โหลดปฏิทินไม่สำเร็จ</div>'}}
function renderCalendar(x){var t=x.totals;document.getElementById('monthSummary').innerHTML='<div class="summary-card"><b>'+t.table_count+'</b><span>โต๊ะที่จอง</span></div><div class="summary-card"><b>'+t.booking_count+'</b><span>รายการจอง</span></div><div class="summary-card"><b>'+t.people_count+'</b><span>จำนวนลูกค้า (คน)</span></div><div class="summary-card"><b>'+t.confirmed_count+'</b><span>ยืนยันแล้ว</span></div><div class="summary-card"><b>'+t.pending_count+'</b><span>รอยืนยัน/ติดต่อ</span></div><div class="summary-card"><b>'+t.assigned_count+'</b><span>จัดชื่อโต๊ะแล้ว</span></div>';var byDay={};x.days.forEach(function(d){byDay[d.booking_date]=d});var p=currentMonth.split('-'),year=Number(p[0]),month=Number(p[1]),first=new Date(year,month-1,1),offset=(first.getDay()+6)%7,last=new Date(year,month,0).getDate(),html=['จ','อ','พ','พฤ','ศ','ส','อา'].map(function(d){return '<div class="weekday">'+d+'</div>'}).join('');for(var i=0;i<offset;i++)html+='<div class="cal-empty"></div>';for(var day=1;day<=last;day++){var ds=currentMonth+'-'+String(day).padStart(2,'0'),d=byDay[ds]||{booking_count:0,table_count:0,people_count:0,confirmed_count:0,pending_count:0,assigned_count:0},classes='cal-day';if(d.booking_count)classes+=' has-bookings';if(d.booking_count&&d.pending_count===0)classes+=' all-confirmed';if(ds===localDate())classes+=' today';html+='<button class="'+classes+'" data-date="'+ds+'"><span class="cal-date">'+day+'</span>'+(d.booking_count?'<span class="cal-bookings">'+d.table_count+' โต๊ะ</span><span class="cal-people">'+d.booking_count+' จอง · '+d.people_count+' คน</span><span class="cal-status">ยืนยัน '+d.confirmed_count+' · รอ '+d.pending_count+'</span>':'')+'</button>'}document.getElementById('calendar').innerHTML=html}
function showDay(value){if(value)document.getElementById('date').value=value;var d=document.getElementById('date').value;currentMonth=d.slice(0,7);document.getElementById('dayHeading').textContent=dayLabel(d);setActiveTab('day');load()}
async function load(){var d=document.getElementById('date').value,s=document.getElementById('filter').value,v=document.getElementById('view').value;document.getElementById('dayHeading').textContent=dayLabel(d);try{var x=await api('/booking/api/admin/bookings?date='+encodeURIComponent(d)+'&status='+encodeURIComponent(s)+'&view='+encodeURIComponent(v));document.querySelector('#view option[value=review]').textContent='กักไว้ตรวจ ('+x.review_count+')';document.getElementById('notice').classList.toggle('hide',v!=='review');render(x.bookings)}catch(e){}}
function render(rows){document.getElementById('count').textContent=rows.length+' รายการ';var box=document.getElementById('list');if(!rows.length){box.innerHTML='<div class="empty">ยังไม่มีรายการจองในวันนี้</div>';return}box.innerHTML=rows.map(function(b){var review=b.spam_status==='review',reasons=String(b.spam_reasons||'').split(',').filter(Boolean).map(function(r){return reasonLabels[r]||r}).join(' · ');return '<article class="booking'+(review?' review':'')+'"><div class="top"><div class="time">'+esc(b.booking_time)+'</div><div class="who"><b>'+esc(b.customer_name)+'</b> · '+b.party_size+' ท่าน · '+b.table_count+' โต๊ะ '+(review?'<span class="tag review-tag">กักไว้ตรวจ'+(reasons?' · '+esc(reasons):'')+'</span>':'')+'<br><a class="phone" href="tel:'+esc(b.phone)+'">'+esc(b.phone)+'</a><div class="meta">'+esc(b.preference||'ให้ร้านจัดโต๊ะให้')+(b.note?' · '+esc(b.note):'')+'<br>เลขจอง '+esc(b.code)+' · ติดต่อทาง '+esc(b.contact_channel)+'</div></div><span class="tag status-'+esc(b.status)+'">'+esc(labels[b.status]||b.status)+'</span></div><div class="edit"><select data-k="status">'+Object.keys(labels).map(function(k){return '<option value="'+k+'"'+(k===b.status?' selected':'')+'>'+labels[k]+'</option>'}).join('')+'</select><input data-k="tableCount" type="number" min="1" max="20" value="'+b.table_count+'" title="จำนวนโต๊ะ" aria-label="จำนวนโต๊ะ"><input data-k="tables" value="'+esc(b.assigned_tables)+'" placeholder="ชื่อโต๊ะ เช่น A1+A2"><input data-k="note" value="'+esc(b.staff_note)+'" placeholder="บันทึกของทีม"><button class="save" data-id="'+b.id+'">บันทึก</button></div></article>'}).join('')}
document.getElementById('list').addEventListener('click',async function(e){if(!e.target.matches('.save'))return;var row=e.target.closest('.booking'),id=e.target.dataset.id;e.target.disabled=true;try{await api('/booking/api/admin/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id,status:row.querySelector('[data-k=status]').value,table_count:row.querySelector('[data-k=tableCount]').value,assigned_tables:row.querySelector('[data-k=tables]').value,staff_note:row.querySelector('[data-k=note]').value})});await load()}catch(err){alert(err.message);e.target.disabled=false}});
document.getElementById('calendar').addEventListener('click',function(e){var day=e.target.closest('.cal-day');if(day)showDay(day.dataset.date)});
function moveMonth(delta){var p=currentMonth.split('-'),d=new Date(Number(p[0]),Number(p[1])-1+delta,1);currentMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');showCalendar()}
document.getElementById('dologin').onclick=async function(){try{await api('/booking/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});showApp()}catch(e){document.getElementById('loginerr').textContent=e.message}};
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('dologin').click()});document.getElementById('reload').onclick=load;document.getElementById('date').onchange=function(){showDay(this.value)};document.getElementById('filter').onchange=load;document.getElementById('view').onchange=load;document.getElementById('tabCalendar').onclick=showCalendar;document.getElementById('tabDay').onclick=function(){showDay(document.getElementById('date').value)};document.getElementById('backCalendar').onclick=showCalendar;document.getElementById('prevMonth').onclick=function(){moveMonth(-1)};document.getElementById('nextMonth').onclick=function(){moveMonth(1)};document.getElementById('thisMonth').onclick=function(){currentMonth=localDate().slice(0,7);showCalendar()};document.getElementById('logout').onclick=async function(){await api('/booking/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});showLogin()};fetch('/booking/api/me').then(function(r){return r.json()}).then(function(x){x.authed?showApp():showLogin()});
</script></body></html>
